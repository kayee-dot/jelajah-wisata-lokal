<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Rekomendasi Wisata Bandung</title>
        <link rel="stylesheet" href="css/rekomendasi.css">
    </head>
    <body>
        <section class="wisata"
        <h1>Wisata Bandung</h1>
        <p>Temukan tempat menarik untuk liburanmu!</p>
        <input type="text" id="cari" placeholder="Cari wisata...">

        <select id="kategori">
            <option value="Semua">Semua Kategori</option>
            <option value="Sejarah">Sejarah</option>
            <option value="Taman">Taman</option>
            <option value="Edukasi">Edukasi</option>
            <option value="Budaya">Budaya</option>
        </select>

        <div id="daftarWisata" class="wisata-list"></div>
    </section>
    <script src="js/rekomendasi.js"></script>
    </body>
</html>
